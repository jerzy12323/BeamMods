services:
  - type: web
    name: beammods
    runtime: python
    buildCommand: "pip install -r requirements.txt && python -m py_compile server.py"
    startCommand: "python server.py"
    healthCheckPath: /api/mods
    disk:
      name: beammods-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATA_DIR
        value: "/var/data/beammods"
      - key: DATABASE_URL
        fromDatabase:
          name: beammods-db
          property: connectionString

databases:
  - name: beammods-db
    databaseName: beammods
    user: beammods
