services:
  - type: web
    name: beammods
    runtime: python
    buildCommand: "pip install -r requirements.txt && python -m py_compile server.py"
    startCommand: "python server.py"
    healthCheckPath: /api/mods
    disk:
      name: beammods-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATA_DIR
        value: "/var/data/beammods"
      - key: DATABASE_URL
        fromDatabase:
          name: beammods-db
          property: connectionString
      - key: PUBLIC_URL
        value: "https://beammods.onrender.com"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: beammods-db
    databaseName: beammods
    user: beammods
